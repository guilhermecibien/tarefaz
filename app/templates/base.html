<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tarefaz{% endblock %}</title>
  <script>
    try { var t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if session.get('user_id') %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('tasks.index') }}">Tare<span>faz</span></a>
    <div class="topbar-dir">
      <a class="conta" href="{{ url_for('auth.account') }}">Conta</a>
      <button class="tema" type="button" id="tema">Tema</button>
      <form method="post" action="{{ url_for('auth.logout') }}"><button class="link-button" type="submit">Sair</button></form>
    </div>
  </header>
  {% endif %}
  <main class="{% if not session.get('user_id') %}auth-layout{% else %}container{% endif %}">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
